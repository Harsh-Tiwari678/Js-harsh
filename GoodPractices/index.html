<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

    <style>
      body {
    font-family: sans-serif;
    line-height: 1.6;
    margin: 0;
    padding: 0;
    background-color: black;
    color: white;
}

h1 {
    text-align: center;
    padding: 20px;
}

.container {
    max-width: 700px;
    margin: 0 auto;
    padding: 20px;
}

.spacer {
    height: 600px;
}

.lazy-image {
    margin: 30px 0;
    width: 100%;
    height: auto;
    opacity: 0;
    transition: opacity 0.5s ease;
}

.lazy-image.loaded {
    opacity: 1;
}
    </style>


<body>
    <h1>Lazy Loading Images</h1>

    <div class="container"> 
        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>

        <div class="spacer"></div>

        <img class="lazy-image" 
             data-src="https://plus.unsplash.com/premium_photo-1673292293042-cafd9c8a3ab3?w=600" 
             alt="Lazy Loaded Image 1">

        <div class="spacer"></div>

        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>

        <div class="spacer"></div>

        <img class="lazy-image" 
             data-src="https://images.unsplash.com/photo-1465146344425-f00d5f5c8f07?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxzZWFyY2h8M3x8bmF0dXJlfGVufDB8fDB8fHww" 
             alt="Lazy Loaded Image 2">

        <div class="spacer"></div>

        <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit...</p>
    </div>

    
</body>


    <script src="Memoryleak.js"></script>
    

</html>
